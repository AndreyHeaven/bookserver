spring:
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true

app:
  security:
    jwt:
      secret: test-secret-min-32-characters-long-for-jwt-signing-tests
      access-token-ttl: 1h
      refresh-token-ttl: 7d
  public:
    base-url: http://localhost:8080
  storage:
    books-dir: ./build/test-data/books
  imports:
    base-dir: ./build/test-data/imports

logging:
  level:
    org.springframework.security: INFO
    com.example.bookserver: DEBUG
