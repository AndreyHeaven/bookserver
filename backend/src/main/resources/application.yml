spring:
  application:
    name: bookserver
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  public:
    base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  storage:
    books-dir: ${APP_STORAGE_BOOKS_DIR:./data/books}
    covers-dir: ${APP_STORAGE_COVERS_DIR:./data/covers}
  imports:
    base-dir: ${APP_IMPORTS_BASE_DIR:./data/imports}
    # How imported files are persisted: `copy` (into storage.books-dir) or `in-place`
    # (reference the original file inside imports.base-dir without copying).
    storage-mode: ${APP_IMPORTS_STORAGE_MODE:copy}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
